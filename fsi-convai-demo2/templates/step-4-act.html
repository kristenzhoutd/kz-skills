<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:24px;font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff;color:#020713;line-height:1.75}
.card{max-width:480px;margin:0 auto;background:#fff;border:1px solid #e6e6e7;border-radius:8px;box-shadow:0 2px 4px rgba(135,143,158,.25);overflow:hidden}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #e6e6e7}
.title{font-size:16px;font-weight:600;color:#020713}
.step{font-size:12px;font-weight:600;color:#676a71}
.body{padding:20px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:0 8px;border-radius:8px;height:24px;margin-bottom:16px}
.status.ok{background:#e7f7f1;color:#0a6a47}
.status.fail{background:#fdecec;color:#bf3636}
.grid{display:grid;grid-template-columns:80px 1fr;row-gap:10px;font-size:14px}
.gl{color:#676a71;font-weight:400}
.gv{color:#020713;font-weight:400}
.gv.em{font-weight:600}
.gv.mono{font-size:12px;font-family:"Roboto Mono",ui-monospace,SFMono-Regular,monospace;color:#676a71}
</style></head>
<body><div class="card">
  <div class="hdr">
    <span class="title">Activation</span>
    <span class="step">4 / 4</span>
  </div>
  <div class="body">
    <div class="status {{STATUS_CLASS}}">
      <span>{{STATUS_ICON}}</span> {{STATUS_TEXT}}
    </div>
    <div class="grid">
      <span class="gl">To</span>
      <span class="gv em">{{RECIPIENT}}</span>
      <span class="gl">Subject</span>
      <span class="gv em">{{SUBJECT}}</span>
      <span class="gl">Offer</span>
      <span class="gv">{{OFFER_TYPE}}</span>
      <span class="gl">Task ID</span>
      <span class="gv mono">{{TASK_ID}}</span>
    </div>
  </div>
</div></body></html>
