<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:24px;font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff;color:#020713;line-height:1.75}
.card{max-width:480px;margin:0 auto;background:#fff;border:1px solid #e6e6e7;border-radius:8px;box-shadow:0 2px 4px rgba(135,143,158,.25);overflow:hidden}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #e6e6e7}
.title{font-size:16px;font-weight:600;color:#020713}
.step{font-size:12px;font-weight:600;color:#676a71}
.body{padding:20px}
.grid{display:grid;grid-template-columns:80px 1fr;row-gap:12px;font-size:14px}
.gl{color:#676a71;font-weight:400}
.gv{color:#020713;font-weight:400}
.gv.em{font-weight:600}
</style></head>
<body><div class="card">
  <div class="hdr">
    <span class="title">Conversational Intelligence</span>
    <span class="step">1 / 4</span>
  </div>
  <div class="body">
    <div class="grid">
      <span class="gl">Name</span>
      <span class="gv em">{{NAME}}</span>
      <span class="gl">Phone</span>
      <span class="gv">{{PHONE}}</span>
      <span class="gl">Account</span>
      <span class="gv">{{ACCOUNT}}</span>
      <span class="gl">Intent</span>
      <span class="gv em">{{INTENT}}</span>
      <span class="gl">Signals</span>
      <span class="gv">{{SIGNALS}}</span>
    </div>
  </div>
</div></body></html>
