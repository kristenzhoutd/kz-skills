<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:24px;font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff;color:#020713;line-height:1.75}
.card{max-width:500px;margin:0 auto;background:#fff;border:1px solid #f0f0f0;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.03);overflow:hidden}
.hdr{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #f0f0f0}
.hdr-icon{width:32px;height:32px;border-radius:8px;background:rgba(122,13,200,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hdr-icon svg{width:16px;height:16px;color:#7a0dc8}
.hdr-text{flex:1}
.title{font-size:14px;font-weight:600;color:#212327}
.step{font-size:10px;font-weight:500;color:#878F9E;letter-spacing:.5px}
.body{padding:20px}
.layers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.lbox{border-radius:10px;padding:14px;border:1px solid #f0f0f0;background:#fff;position:relative;overflow:hidden}
.lbox::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.lbox.ml::before{background:#3B6FD4}
.lbox.llm::before{background:#7a0dc8}
.ltag{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:block}
.ltag.ml{color:#3B6FD4}
.ltag.llm{color:#7a0dc8}
.lprod{font-size:15px;font-weight:600;color:#212327;margin-bottom:4px}
.lrsn{font-size:12px;color:#636A77;line-height:1.5}
.adjudication{background:#F7F8FB;border-radius:10px;padding:16px;border:1px solid #f0f0f0}
.adj-hdr{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.adj-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#878F9E}
.atag{font-size:11px;font-weight:600;padding:2px 10px;border-radius:8px;display:inline-flex;align-items:center;height:22px}
.atag.agree{background:#e7f7f1;color:#0a6a47}
.atag.refined{background:#fef2db;color:#654c1e}
.adj-grid{display:grid;grid-template-columns:auto 1fr;row-gap:8px;column-gap:10px;font-size:13px}
.adj-label{color:#878F9E;font-weight:500;font-size:12px;white-space:nowrap;padding-top:1px}
.adj-value{color:#212327;font-weight:400;line-height:1.5}
.adj-value.em{font-weight:600;color:#020713}
</style></head>
<body><div class="card">
  <div class="hdr">
    <div class="hdr-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6Z"/></svg></div>
    <div class="hdr-text">
      <div class="title">AI Decisioning</div>
      <div class="step">STEP 3 OF 4</div>
    </div>
  </div>
  <div class="body">
    <div class="layers">
      <div class="lbox ml">
        <span class="ltag ml">ML Model</span>
        <div class="lprod">{{ML_PRODUCT}}</div>
        <div class="lrsn">{{ML_REASON}}</div>
      </div>
      <div class="lbox llm">
        <span class="ltag llm">LLM Real-Time Analysis</span>
        <div class="lprod">{{LLM_PRODUCT}}</div>
        <div class="lrsn">{{LLM_REASON}}</div>
      </div>
    </div>
    <div class="adjudication">
      <div class="adj-hdr">
        <span class="adj-title">Adjudication</span>
        <span class="atag {{AGREEMENT_CLASS}}">{{AGREEMENT_LABEL}}</span>
      </div>
      <div class="adj-grid">
        <span class="adj-label">Conflict</span>
        <span class="adj-value">{{ADJ_CONFLICT}}</span>
        <span class="adj-label">ML basis</span>
        <span class="adj-value">{{ADJ_ML_BASIS}}</span>
        <span class="adj-label">LLM basis</span>
        <span class="adj-value">{{ADJ_LLM_BASIS}}</span>
        <span class="adj-label">Decision</span>
        <span class="adj-value em">{{ADJ_DECISION}}</span>
        <span class="adj-label">Rationale</span>
        <span class="adj-value">{{ADJ_RATIONALE}}</span>
      </div>
    </div>
  </div>
</div></body></html>
