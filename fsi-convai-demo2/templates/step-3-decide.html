<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:24px;font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff;color:#020713;line-height:1.75}
.card{max-width:500px;margin:0 auto;background:#fff;border:1px solid #e6e6e7;border-radius:8px;box-shadow:0 2px 4px rgba(135,143,158,.25);overflow:hidden}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #e6e6e7}
.title{font-size:16px;font-weight:600;color:#020713}
.step{font-size:12px;font-weight:600;color:#676a71}
.body{padding:20px}
.layers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.lbox{border-radius:8px;padding:12px;border:1px solid #e6e6e7;background:#fff}
.ltag{font-size:12px;font-weight:600;padding:0 8px;border-radius:8px;display:inline-flex;align-items:center;height:20px;margin-bottom:8px}
.ltag.ml{background:#f2f5fe;color:#032eb5}
.ltag.llm{background:#f2f3f3;color:#353942}
.lprod{font-size:14px;font-weight:600;color:#020713;margin-bottom:2px}
.lrsn{font-size:12px;color:#676a71}
.tag-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.atag{font-size:12px;font-weight:600;padding:0 8px;border-radius:8px;height:24px;display:inline-flex;align-items:center}
.atag.agree{background:#e7f7f1;color:#0a6a47}
.atag.refined{background:#fef2db;color:#654c1e}
.rationale{font-size:14px;color:#020713;background:#f2f3f3;border-radius:8px;padding:12px 16px}
</style></head>
<body><div class="card">
  <div class="hdr">
    <span class="title">AI Decisioning</span>
    <span class="step">3 / 4</span>
  </div>
  <div class="body">
    <div class="layers">
      <div class="lbox">
        <span class="ltag ml">ML Model</span>
        <div class="lprod">{{ML_PRODUCT}}</div>
        <div class="lrsn">{{ML_REASON}}</div>
      </div>
      <div class="lbox">
        <span class="ltag llm">LLM Analysis</span>
        <div class="lprod">{{LLM_PRODUCT}}</div>
        <div class="lrsn">{{LLM_REASON}}</div>
      </div>
    </div>
    <div class="tag-row">
      <span class="atag {{AGREEMENT_CLASS}}">{{AGREEMENT_LABEL}}</span>
    </div>
    <div class="rationale">{{LLM_DECISIONING_RATIONALE}}</div>
  </div>
</div></body></html>
